name: labconnect_admin
description: LabConnect Admin App - read-only access to patients, facilities, orders and results.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^10.1.4
  intl: ^0.19.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
